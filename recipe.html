<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recipe — BestyKitchen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Lora:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root { --red:#E8272A; --dark:#1A1A1A; --cream:#F5F0E8; --warm-white:#FEFCF8; --mid:#6B6560; --border:rgba(26,26,26,0.12); }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'DM Sans',sans-serif; background:var(--warm-white); color:var(--dark); }

  nav { background:var(--dark); padding:0 40px; display:flex; align-items:center; justify-content:space-between; height:60px; position:sticky; top:0; z-index:100; }
  .logo { font-family:'Bebas Neue',sans-serif; font-size:26px; letter-spacing:2px; color:var(--cream); text-decoration:none; }
  .logo span { color:var(--red); }
  nav ul { list-style:none; display:flex; gap:32px; }
  nav ul a { color:rgba(245,240,232,0.65); text-decoration:none; font-size:13px; font-weight:500; letter-spacing:0.5px; text-transform:uppercase; }
  nav ul a:hover { color:var(--cream); }

  .recipe-hero { width:100%; height:420px; position:relative; overflow:hidden; background:linear-gradient(135deg,#2a2520,#1a1510); display:flex; align-items:center; justify-content:center; font-size:100px; }
  .recipe-hero img { width:100%; height:100%; object-fit:cover; }
  .recipe-hero-overlay { position:absolute; inset:0; background:linear-gradient(to top,rgba(0,0,0,0.85) 0%,rgba(0,0,0,0.2) 60%,transparent 100%); }
  .recipe-hero-info { position:absolute; bottom:0; left:0; right:0; padding:32px 40px; }
  .recipe-episode { font-size:11px; color:var(--red); font-weight:500; letter-spacing:1.5px; text-transform:uppercase; margin-bottom:10px; }
  .recipe-title { font-family:'Bebas Neue',sans-serif; font-size:56px; color:#fff; letter-spacing:2px; line-height:1; }
  .recipe-country-badge { display:inline-block; background:var(--red); color:#fff; font-size:11px; font-weight:500; letter-spacing:1px; text-transform:uppercase; padding:4px 12px; border-radius:2px; margin-top:12px; }

  .recipe-layout { display:grid; grid-template-columns:1fr 340px; gap:48px; max-width:1100px; margin:0 auto; padding:48px 40px; }

  .back-link { display:inline-flex; align-items:center; gap:8px; color:var(--mid); font-size:13px; text-decoration:none; margin-bottom:28px; }
  .back-link:hover { color:var(--dark); }

  .recipe-description { font-family:'Lora',serif; font-size:17px; line-height:1.8; color:var(--mid); font-style:italic; margin-bottom:36px; padding-bottom:36px; border-bottom:1px solid var(--border); }

  .section-title { font-family:'Bebas Neue',sans-serif; font-size:28px; letter-spacing:2px; color:var(--dark); margin-bottom:20px; }

  .steps-list { list-style:none; }
  .step-item { display:flex; gap:20px; margin-bottom:28px; padding-bottom:28px; border-bottom:1px solid var(--border); }
  .step-item:last-child { border-bottom:none; }
  .step-num { flex-shrink:0; width:36px; height:36px; background:var(--dark); color:var(--cream); font-family:'Bebas Neue',sans-serif; font-size:18px; letter-spacing:1px; display:flex; align-items:center; justify-content:center; border-radius:2px; margin-top:2px; }
  .step-text { font-size:15px; line-height:1.75; padding-top:6px; }

  .sidebar { position:sticky; top:80px; align-self:start; }
  .meta-card { background:var(--cream); border:1px solid var(--border); border-radius:6px; padding:24px; margin-bottom:20px; }
  .meta-row { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--border); font-size:14px; }
  .meta-row:last-child { border-bottom:none; }
  .meta-label { color:var(--mid); font-size:12px; text-transform:uppercase; letter-spacing:0.8px; }
  .meta-val { font-weight:500; }

  .ingredients-card { background:var(--dark); border-radius:6px; padding:24px; }
  .ingredients-card .section-title { color:var(--cream); margin-bottom:16px; font-size:22px; }
  .ingredient-item { display:flex; align-items:flex-start; gap:10px; padding:8px 0; border-bottom:1px solid rgba(255,255,255,0.07); font-size:14px; color:rgba(245,240,232,0.8); }
  .ingredient-item:last-child { border-bottom:none; }
  .ingredient-bullet { color:var(--red); font-size:16px; line-height:1.4; flex-shrink:0; }

  .yt-link { display:flex; align-items:center; justify-content:center; gap:10px; background:var(--red); color:#fff; padding:12px 20px; border-radius:4px; text-decoration:none; font-size:13px; font-weight:500; margin-top:16px; text-transform:uppercase; letter-spacing:0.5px; transition:background 0.2s; }
  .yt-link:hover { background:#c41f22; }

  footer { background:var(--dark); padding:32px 40px; display:flex; align-items:center; justify-content:space-between; margin-top:60px; }
  footer p { font-size:12px; color:rgba(245,240,232,0.35); }
  footer a { color:rgba(245,240,232,0.5); text-decoration:none; font-size:12px; }

  @media(max-width:768px) {
    .recipe-layout { grid-template-columns:1fr; padding:24px 16px; gap:24px; }
    .recipe-title { font-size:38px; }
    .recipe-hero { height:280px; }
    nav { padding:0 16px; }
    .recipe-hero-info { padding:20px 16px; }
    .sidebar { position:static; }
    footer { padding:24px 16px; flex-direction:column; gap:12px; text-align:center; }
  }
</style>
</head>
<body>

<nav>
  <a href="index.html" class="logo">Besty<span>Kitchen</span></a>
  <ul>
    <li><a href="index.html">Recipes</a></li>
    <li><a href="#spices">Spice Store</a></li>
  </ul>
</nav>

<div id="recipe-content"><div style="padding:80px 40px;text-align:center;color:var(--mid)">Loading...</div></div>

<footer>
  <p>Not affiliated with Best Ever Food Review Show. Fan project by BestyKitchen.</p>
  <a href="https://www.youtube.com/@BestEverFoodReviewShow" target="_blank">▶ Watch BEFRS on YouTube</a>
</footer>

<script>
const RECIPES = [
  {
    id:1, title:"Bún Bò Huế", country:"Vietnam", region:"Asia", episode:"BEFRS · Vietnam Series", emoji:"🍜",
    description:"A fiery, lemongrass-scented beef noodle soup from the imperial city of Huế — bolder and spicier than pho, with a deep, complex broth that takes hours to build.",
    cookTime:120, servings:4, difficulty:"Medium",
    youtubeUrl:"https://www.youtube.com/@BestEverFoodReviewShow",
    ingredients:["500g beef shank or brisket","200g pork hocks","400g round rice noodles (bún)","2 stalks lemongrass, bruised","1 tbsp shrimp paste (mắm ruốc)","2 tbsp annatto oil","3 cloves garlic, minced","2 shallots, sliced","1 tbsp fish sauce","1 tsp sugar","Salt to taste","Fresh herbs to serve: mint, perilla, banana blossom","Lime wedges and chilli to serve"],
    steps:["Blanch the beef shank and pork hocks in boiling water for 5 minutes, then drain and rinse. This removes impurities and keeps the broth clear.","In a large pot, cover the blanched meat with 2.5 litres of cold water. Bring to a boil, then reduce to a low simmer. Skim any foam that rises to the surface.","Add the bruised lemongrass stalks, fish sauce, and sugar. Simmer on low heat for 60–90 minutes until the beef is tender.","In a small pan, heat the annatto oil over medium heat. Fry the garlic and shallots until fragrant, about 2 minutes. Add the shrimp paste and fry for another minute. Add this paste to the broth.","Remove the beef and slice it thinly against the grain. Discard the lemongrass. Taste the broth and adjust salt and fish sauce.","Cook the rice noodles according to package instructions. Divide into bowls.","Ladle the hot broth over the noodles and top with slices of beef and pork. Serve with fresh herbs, bean sprouts, lime, and chilli on the side."]
  },
  {
    id:2, title:"Doro Wat", country:"Ethiopia", region:"Africa", episode:"BEFRS · Ethiopia Series", emoji:"🍗",
    description:"Ethiopia's most beloved dish — slow-cooked chicken in a deep, berbere-spiced sauce with whole hard-boiled eggs. Rich, warming, and deeply aromatic.",
    cookTime:90, servings:4, difficulty:"Medium",
    youtubeUrl:"https://www.youtube.com/@BestEverFoodReviewShow",
    ingredients:["1 whole chicken, cut into pieces","4 large onions, finely chopped","4 tbsp berbere spice blend","3 tbsp niter kibbeh (Ethiopian spiced butter) or regular butter","4 cloves garlic, minced","1 tsp fresh ginger, grated","4 hard-boiled eggs, peeled and scored","1 tsp cardamom","Salt to taste","Injera to serve"],
    steps:["Dry-cook the chopped onions in a large pot over medium heat with no oil, stirring constantly for 20–25 minutes until they are very soft and beginning to caramelise. This is the key base of the dish.","Add the niter kibbeh (or butter) and continue cooking the onions for another 5 minutes.","Add the garlic, ginger, and berbere spice. Stir and cook for 3–4 minutes until the spices are fragrant and the oil begins to separate from the paste.","Add the chicken pieces and stir to coat in the spiced onion base. Add a splash of water to prevent sticking.","Cover and simmer on low heat for 40–50 minutes, stirring occasionally, until the chicken is fully cooked and tender and the sauce is thick and dark.","Score the hard-boiled eggs all over with a fork or knife. Nestle them into the sauce for the final 10 minutes of cooking so they absorb flavour.","Taste and adjust salt. Serve on a large piece of injera, with extra injera on the side for scooping."]
  },
  {
    id:3, title:"Al Pastor Tacos", country:"Mexico", region:"Americas", episode:"BEFRS · Mexico City Series", emoji:"🌮",
    description:"Marinated pork slow-roasted with pineapple, served in small corn tortillas with raw onion, cilantro, and a squeeze of lime.",
    cookTime:60, servings:6, difficulty:"Medium",
    youtubeUrl:"https://www.youtube.com/@BestEverFoodReviewShow",
    ingredients:["1kg pork shoulder, thinly sliced","3 dried guajillo chillies, soaked and deseeded","2 dried ancho chillies, soaked and deseeded","½ pineapple — half blended for marinade, half sliced for roasting","4 cloves garlic","1 tsp cumin","1 tsp dried oregano","2 tbsp white vinegar","1 tbsp achiote paste","Salt to taste","Small corn tortillas to serve","White onion, finely diced","Fresh cilantro, chopped","Lime wedges"],
    steps:["Blend the soaked guajillo and ancho chillies with the blended pineapple, garlic, cumin, oregano, vinegar, and achiote paste until completely smooth.","Marinate the sliced pork in the blended mixture. Season with salt, mix well, and leave for at least 2 hours — overnight in the fridge is ideal.","Cook the marinated pork in a hot dry pan or griddle in batches over high heat until caramelised and slightly charred at the edges. Don't overcrowd the pan.","While the pork is resting, grill or caramelise the fresh pineapple slices until golden.","Warm the corn tortillas on a dry pan for 30 seconds each side.","To assemble: place pork on the tortilla, top with a small piece of pineapple, diced white onion, and fresh cilantro. Finish with a squeeze of fresh lime."]
  },
  {
    id:4, title:"Butter Chicken", country:"India", region:"Asia", episode:"BEFRS · India Series", emoji:"🍛",
    description:"Tender chicken in a velvety tomato-cream sauce scented with fenugreek and warming spices. The dish that conquered the world.",
    cookTime:75, servings:4, difficulty:"Easy",
    youtubeUrl:"https://www.youtube.com/@BestEverFoodReviewShow",
    ingredients:["700g chicken thighs, boneless","150ml plain yoghurt","2 tsp garam masala","1 tsp turmeric","1 tsp cumin","2 tsp kashmiri chilli powder","Salt to taste","3 tbsp butter","1 large onion, finely chopped","4 cloves garlic, minced","1 tsp ginger, grated","400g canned tomatoes, blended","150ml heavy cream","1 tsp dried fenugreek leaves (kasuri methi)","Basmati rice or naan to serve"],
    steps:["Mix the yoghurt, garam masala, turmeric, cumin, 1 tsp kashmiri chilli, and salt in a bowl. Add the chicken, coat well, and marinate for at least 30 minutes.","Cook the marinated chicken in a hot pan with a little oil until charred on the outside and cooked through, about 6–8 minutes per side. Set aside.","In the same pan, melt the butter over medium heat. Add the onion and cook until golden, about 10 minutes. Add the garlic and ginger and cook for 2 more minutes.","Add the remaining kashmiri chilli and the blended tomatoes. Simmer for 15 minutes, stirring occasionally, until the sauce darkens and thickens.","Add the cream and stir. Simmer for 5 more minutes. Add the chicken pieces to the sauce.","Crush the dried fenugreek leaves between your palms and stir them into the sauce. Taste and adjust salt. Simmer for a final 5 minutes.","Serve over steamed basmati rice or with warm naan."]
  },
  {
    id:5, title:"Beef Rendang", country:"Indonesia", region:"Asia", episode:"BEFRS · Indonesia Series", emoji:"🥘",
    description:"Slow-cooked beef in a thick, spiced coconut paste until almost dry — intensely flavoured, impossibly tender, and worth every minute of cooking.",
    cookTime:180, servings:6, difficulty:"Hard",
    youtubeUrl:"https://www.youtube.com/@BestEverFoodReviewShow",
    ingredients:["1kg beef chuck, cut into large cubes","400ml coconut milk","4 kaffir lime leaves","2 lemongrass stalks, bruised","1 turmeric leaf (optional)","2 tsp tamarind paste","1 tsp palm sugar or brown sugar","Salt to taste","For the spice paste: 8 dried red chillies (soaked)","6 shallots","4 cloves garlic","2 cm fresh galangal","2 cm fresh ginger","1 tsp coriander seeds, toasted"],
    steps:["Blend all the spice paste ingredients into a smooth paste using a blender or food processor, adding a splash of water if needed.","Heat 2 tablespoons of oil in a heavy-bottomed pot or wok over medium heat. Fry the spice paste for 5–8 minutes, stirring constantly, until fragrant and the oil separates from the paste.","Add the lemongrass, kaffir lime leaves, and turmeric leaf. Stir and cook for 1 more minute.","Add the beef cubes and stir to coat completely in the spice paste. Cook for 5 minutes until the meat is sealed.","Pour in the coconut milk and add the tamarind paste and palm sugar. Bring to a boil, then reduce to the lowest possible simmer.","Cook uncovered, stirring every 20 minutes, for 2–3 hours. As the coconut milk reduces, the beef will begin to fry in the coconut oil. Keep stirring to prevent burning.","The rendang is done when the sauce is almost completely dry, deeply dark, and the beef is very tender. Taste and adjust salt. Serve with steamed white rice."]
  },
  {
    id:6, title:"Harira Soup", country:"Morocco", region:"Africa", episode:"BEFRS · Morocco Series", emoji:"🍲",
    description:"A hearty Moroccan soup of tomatoes, lentils, chickpeas, and vermicelli — traditionally broken to end the Ramadan fast, but loved all year round.",
    cookTime:50, servings:6, difficulty:"Easy",
    youtubeUrl:"https://www.youtube.com/@BestEverFoodReviewShow",
    ingredients:["200g canned chickpeas, drained","150g green or brown lentils, rinsed","200g lamb or beef, diced small (optional)","400g canned chopped tomatoes","1 large onion, finely chopped","3 stalks celery, chopped","Small bunch fresh cilantro, chopped","Small bunch fresh parsley, chopped","2 tbsp tomato paste","1 tsp turmeric","1 tsp cinnamon","1 tsp ginger","1 tsp cumin","100g vermicelli noodles","Juice of 1 lemon","Salt and pepper to taste","Lemon wedges to serve"],
    steps:["In a large pot, heat 2 tablespoons of olive oil over medium heat. If using meat, brown it first, then set aside.","Fry the onion and celery until softened, about 5 minutes. Add the turmeric, cinnamon, ginger, and cumin. Stir and cook for 1 minute until fragrant.","Add the tomato paste, canned tomatoes, and 1.5 litres of water. Add the lentils and browned meat. Bring to a boil, then reduce to a simmer for 20 minutes.","Add the chickpeas and continue simmering for 10 more minutes until the lentils are fully cooked and soft.","Add the vermicelli noodles and cook for another 5 minutes.","Stir in most of the fresh cilantro and parsley. Add the lemon juice. Taste and season well with salt and pepper.","Serve hot, garnished with fresh herbs and a wedge of lemon on the side."]
  }
];

function getParam(n) { return new URLSearchParams(window.location.search).get(n); }

const id = parseInt(getParam('id'));
const recipe = RECIPES.find(r => r.id === id);

if (!recipe) {
  document.getElementById('recipe-content').innerHTML = `<div style="padding:80px 40px;text-align:center"><div style="font-size:48px">😕</div><h2 style="font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:2px;margin-top:16px">Recipe Not Found</h2><a href="index.html" style="display:inline-block;margin-top:20px;color:var(--red);text-decoration:none;font-size:14px">← Back to all recipes</a></div>`;
} else {
  document.title = recipe.title + ' — BestyKitchen';
  document.getElementById('recipe-content').innerHTML = `
    <div class="recipe-hero">
      <span style="position:relative;z-index:1">${recipe.emoji}</span>
      <div class="recipe-hero-overlay"></div>
      <div class="recipe-hero-info">
        <div class="recipe-episode">${recipe.episode}</div>
        <div class="recipe-title">${recipe.title}</div>
        <div class="recipe-country-badge">📍 ${recipe.country}</div>
      </div>
    </div>
    <div class="recipe-layout">
      <div>
        <a href="index.html" class="back-link">← All Recipes</a>
        <div class="recipe-description">${recipe.description}</div>
        <div class="section-title">How to Cook</div>
        <ol class="steps-list">
          ${recipe.steps.map((s,i) => `<li class="step-item"><div class="step-num">${i+1}</div><div class="step-text">${s}</div></li>`).join('')}
        </ol>
      </div>
      <div class="sidebar">
        <div class="meta-card">
          <div class="meta-row"><span class="meta-label">Country</span><span class="meta-val">${recipe.country}</span></div>
          <div class="meta-row"><span class="meta-label">Cook Time</span><span class="meta-val">${recipe.cookTime} mins</span></div>
          <div class="meta-row"><span class="meta-label">Servings</span><span class="meta-val">${recipe.servings}</span></div>
          <div class="meta-row"><span class="meta-label">Difficulty</span><span class="meta-val">${recipe.difficulty}</span></div>
        </div>
        <div class="ingredients-card">
          <div class="section-title">Ingredients</div>
          ${recipe.ingredients.map(i => `<div class="ingredient-item"><span class="ingredient-bullet">●</span>${i}</div>`).join('')}
        </div>
        <a href="${recipe.youtubeUrl}" target="_blank" class="yt-link">▶ Watch on YouTube</a>
      </div>
    </div>`;
}
</script>
</body>
</html>
