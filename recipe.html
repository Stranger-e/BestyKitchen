<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recipe — BestyKitchen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Lora:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--red:#E8272A;--dark:#1A1A1A;--cream:#F5F0E8;--warm-white:#FEFCF8;--mid:#6B6560;--border:rgba(26,26,26,0.12)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'DM Sans',sans-serif;background:var(--warm-white);color:var(--dark)}
  nav{background:var(--dark);padding:0 40px;display:flex;align-items:center;justify-content:space-between;height:60px;position:sticky;top:0;z-index:100}
  .logo{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:2px;color:var(--cream);text-decoration:none}
  .logo span{color:var(--red)}
  nav ul{list-style:none;display:flex;gap:32px}
  nav ul a{color:rgba(245,240,232,0.65);text-decoration:none;font-size:13px;font-weight:500;letter-spacing:.5px;text-transform:uppercase}
  nav ul a:hover{color:var(--cream)}
  .recipe-hero{width:100%;height:420px;position:relative;overflow:hidden;background:linear-gradient(135deg,#2a2520,#1a1510);display:flex;align-items:center;justify-content:center}
  .recipe-hero img{width:100%;height:100%;object-fit:cover;display:block}
  .recipe-emoji{font-size:100px;position:relative;z-index:1}
  .recipe-hero-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.85) 0%,rgba(0,0,0,.2) 60%,transparent 100%)}
  .recipe-hero-info{position:absolute;bottom:0;left:0;right:0;padding:32px 40px}
  .recipe-episode{font-size:11px;color:var(--red);font-weight:500;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px}
  .recipe-title{font-family:'Bebas Neue',sans-serif;font-size:56px;color:#fff;letter-spacing:2px;line-height:1}
  .recipe-country-badge{display:inline-block;background:var(--red);color:#fff;font-size:11px;font-weight:500;letter-spacing:1px;text-transform:uppercase;padding:4px 12px;border-radius:2px;margin-top:12px}
  .recipe-layout{display:grid;grid-template-columns:1fr 340px;gap:48px;max-width:1100px;margin:0 auto;padding:48px 40px}
  .back-link{display:inline-flex;align-items:center;gap:8px;color:var(--mid);font-size:13px;text-decoration:none;margin-bottom:28px}
  .back-link:hover{color:var(--dark)}
  .recipe-description{font-family:'Lora',serif;font-size:17px;line-height:1.8;color:var(--mid);font-style:italic;margin-bottom:36px;padding-bottom:36px;border-bottom:1px solid var(--border)}
  .section-title{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;color:var(--dark);margin-bottom:20px}
  .steps-list{list-style:none}
  .step-item{display:flex;gap:20px;margin-bottom:28px;padding-bottom:28px;border-bottom:1px solid var(--border)}
  .step-item:last-child{border-bottom:none}
  .step-num{flex-shrink:0;width:36px;height:36px;background:var(--dark);color:var(--cream);font-family:'Bebas Neue',sans-serif;font-size:18px;display:flex;align-items:center;justify-content:center;border-radius:2px;margin-top:2px}
  .step-text{font-size:15px;line-height:1.75;padding-top:6px}
  .sidebar{position:sticky;top:80px;align-self:start}
  .meta-card{background:var(--cream);border:1px solid var(--border);border-radius:6px;padding:24px;margin-bottom:20px}
  .meta-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px}
  .meta-row:last-child{border-bottom:none}
  .meta-label{color:var(--mid);font-size:12px;text-transform:uppercase;letter-spacing:.8px}
  .meta-val{font-weight:500}
  .ingredients-card{background:var(--dark);border-radius:6px;padding:24px}
  .ingredients-card .section-title{color:var(--cream);margin-bottom:16px;font-size:22px}
  .ingredient-item{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:14px;color:rgba(245,240,232,0.8)}
  .ingredient-item:last-child{border-bottom:none}
  .ingredient-bullet{color:var(--red);font-size:16px;line-height:1.4;flex-shrink:0}
  .yt-link{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--red);color:#fff;padding:12px 20px;border-radius:4px;text-decoration:none;font-size:13px;font-weight:500;margin-top:16px;text-transform:uppercase;letter-spacing:.5px;transition:background .2s}
  .yt-link:hover{background:#c41f22}
  footer{background:var(--dark);padding:32px 40px;display:flex;align-items:center;justify-content:space-between;margin-top:60px}
  footer p{font-size:12px;color:rgba(245,240,232,0.35)}
  footer a{color:rgba(245,240,232,0.5);text-decoration:none;font-size:12px}
  @media(max-width:768px){
    .recipe-layout{grid-template-columns:1fr;padding:24px 16px;gap:24px}
    .recipe-title{font-size:38px}
    .recipe-hero{height:280px}
    nav{padding:0 16px}
    .recipe-hero-info{padding:20px 16px}
    .sidebar{position:static}
    footer{padding:24px 16px;flex-direction:column;gap:12px;text-align:center}
  }
</style>
</head>

    description:"A fiery lemongrass-scented beef noodle soup from the imperial city of Hu\u1ebf \u2014 bolder and spicier than pho, with a deep complex broth. Served at \u0110\u00f4ng Ba market with blood cake and fermented shrimp paste.",
    cookTime:120,servings:4,difficulty:"Medium",
    youtubeUrl:"https://www.youtube.com/@BestEverFoodReviewShow",
    ingredients:["500g beef shank or brisket","200g pork hocks","400g round rice noodles (bún)","2 stalks lemongrass, bruised","1 tbsp shrimp paste (mắm ruốc)","2 tbsp annatto oil","3 cloves garlic, minced","2 shallots, sliced","1 tbsp fish sauce","1 tsp sugar","Salt to taste","Optional: blood cake, sliced","Fresh herbs: mint, perilla, banana blossom","Lime wedges and fresh chilli to serve"],
    steps:["Blanch the beef shank and pork hocks in boiling water for 5 minutes, drain and rinse to remove impurities.","In a large pot, cover meat with 2.5 litres of cold water. Bring to a boil then reduce to a low simmer, skimming any foam.","Add bruised lemongrass, fish sauce, and sugar. Simmer on low for 60–90 minutes until beef is completely tender.","In a small pan, heat annatto oil. Fry garlic and shallots until fragrant, 2 minutes. Add shrimp paste and fry 1 more minute. Pour into the broth.","Remove beef, slice thinly against the grain. Discard lemongrass. Taste and adjust salt and fish sauce.","Cook rice noodles per package instructions. Divide into bowls.","Ladle hot broth over noodles. Top with sliced beef and pork. Serve with fresh herbs, lime, chilli, and blood cake on the side."]

    description:"Ethiopia's national dish \u2014 slow-cooked chicken in a deeply spiced berbere sauce with whole hard-boiled eggs. Simmered for hours, served on injera. Sonny tried this fresh from a vendor at Mercato, the largest open market in Africa.",
    cookTime:360,servings:4,difficulty:"Medium",
    youtubeUrl:"https://www.youtube.com/@BestEverFoodReviewShow",
    ingredients:["1 whole chicken, cut into pieces","4 large onions, very finely chopped","4 tbsp berbere spice blend","3 tbsp niter kibbeh (Ethiopian spiced clarified butter)","4 cloves garlic, minced","1 tsp fresh ginger, grated","4 hard-boiled eggs, peeled and scored","Salt to taste","Injera to serve"],
    steps:["Dry-cook onions in a large pot with no oil over medium heat, stirring constantly for 20–25 minutes until very soft and caramelising. This onion base is the soul of doro wat.","Add niter kibbeh and cook the onions 5 more minutes.","Add garlic, ginger, and berbere spice. Stir and cook 3–4 minutes until deeply fragrant and oil begins to separate.","Add chicken pieces, stir to coat completely. Splash in a little water to prevent sticking.","Cover and simmer on the lowest heat for 2–3 hours (traditionally up to 6), stirring occasionally, until sauce is thick and dark and chicken is falling-tender.","Score hard-boiled eggs all over with a fork. Nestle into the sauce for the final 15 minutes so they absorb flavour and turn orange.","Taste and adjust salt. Serve on injera — use more injera to scoop. Feed each other (gursha) as a gesture of affection."]
  },
{
    id:3,title:"Al Pastor Tacos",country:"Mexico",region:"Americas",
    episode:"BEFRS \u00b7 Mexico City Series",emoji:"\ud83c\udf2e",image:null,
    description:"Marinated pork slow-roasted with pineapple, served in small corn tortillas with raw white onion, fresh cilantro, and lime.",
    cookTime:60,servings:6,difficulty:"Medium",
    youtubeUrl:"https://www.youtube.com/@BestEverFoodReviewShow",
    ingredients:["1kg pork shoulder, thinly sliced","3 dried guajillo chillies, soaked and deseeded","2 dried ancho chillies, soaked and deseeded","½ pineapple — half blended for marinade, half sliced for grilling","4 cloves garlic","1 tsp cumin","1 tsp dried oregano","2 tbsp white vinegar","1 tbsp achiote paste","Salt to taste","Small corn tortillas","White onion, finely diced","Fresh cilantro, chopped","Lime wedges"],
    steps:["Blend soaked chillies with blended pineapple, garlic, cumin, oregano, vinegar, and achiote paste until smooth.","Marinate sliced pork in the blend. Season with salt. Leave at least 2 hours — overnight is ideal.","Cook marinated pork in a very hot dry pan in batches until caramelised and charred at the edges.","Grill or caramelise fresh pineapple slices until golden.","Warm corn tortillas on a dry pan 30 seconds each side.","Assemble: place pork on tortilla, top with pineapple, diced onion, and cilantro. Finish with a squeeze of lime."]
  },
{
    id:4,title:"Butter Chicken",country:"India",region:"Asia",
    episode:"BEFRS \u00b7 India Series",emoji:"\ud83c\udf5b",image:null,
    description:"Tender chicken in a velvety tomato-cream sauce scented with fenugreek and warming spices. The dish that conquered the world.",
    cookTime:75,servings:4,difficulty:"Easy",
    youtubeUrl:"https://www.youtube.com/@BestEverFoodReviewShow",
    ingredients:["700g chicken thighs, boneless","150ml plain yoghurt","2 tsp garam masala","1 tsp turmeric","1 tsp cumin","2 tsp kashmiri chilli powder","Salt to taste","3 tbsp butter","1 large onion, finely chopped","4 cloves garlic, minced","1 tsp ginger, grated","400g canned tomatoes, blended","150ml heavy cream","1 tsp dried fenugreek leaves (kasuri methi)","Basmati rice or naan to serve"],
    steps:["Mix yoghurt, garam masala, turmeric, cumin, 1 tsp kashmiri chilli and salt. Add chicken, coat well, marinate 30 minutes.","Cook marinated chicken in a hot pan until charred outside and cooked through, 6–8 minutes per side. Set aside.","Melt butter in same pan. Add onion, cook until golden, 10 minutes. Add garlic and ginger, cook 2 more minutes.","Add remaining kashmiri chilli and blended tomatoes. Simmer 15 minutes until sauce darkens and thickens.","Add cream, stir, simmer 5 minutes. Add chicken pieces back in.","Crush dried fenugreek between your palms and stir in. Simmer a final 5 minutes. Adjust salt.","Serve over steamed basmati rice or with warm naan."]
  },
{
    id:5,title:"Beef Rendang",country:"Indonesia",region:"Asia",
    episode:"BEFRS \u00b7 Indonesia Series",emoji:"\ud83e\udd58",image:null,
    description:"Slow-cooked beef in a thick spiced coconut paste until almost completely dry \u2014 intensely flavoured, impossibly tender.",
    cookTime:180,servings:6,difficulty:"Hard",
    youtubeUrl:"https://www.youtube.com/@BestEverFoodReviewShow",
    ingredients:["1kg beef chuck, large cubes","400ml coconut milk","4 kaffir lime leaves","2 lemongrass stalks, bruised","2 tsp tamarind paste","1 tsp palm sugar","Salt to taste","Spice paste: 8 soaked dried red chillies, 6 shallots, 4 cloves garlic, 2cm galangal, 2cm ginger, 1 tsp toasted coriander seeds"],
    steps:["Blend all spice paste ingredients into a smooth paste.","Heat 2 tbsp oil in a heavy pot. Fry the spice paste 5–8 minutes, stirring constantly, until fragrant and oil separates.","Add lemongrass and kaffir lime leaves. Stir 1 more minute.","Add beef and stir to coat. Cook 5 minutes to seal the meat.","Pour in coconut milk. Add tamarind and palm sugar. Bring to a boil then reduce to the lowest simmer.","Cook uncovered, stirring every 20 minutes, for 2–3 hours until sauce is almost completely dry and beef is very tender.","Serve with white rice."]
  },
{

    episode:"BEFRS \u00b7 Morocco Series",emoji:"\ud83c\udf72",image:null,
    description:"A hearty Moroccan soup of tomatoes, lentils, chickpeas and vermicelli \u2014 traditionally broken to end the Ramadan fast but loved all year round.",
    cookTime:50,servings:6,difficulty:"Easy",

    ingredients:["200g canned chickpeas, drained","150g green or brown lentils, rinsed","200g lamb or beef, diced small (optional)","400g canned chopped tomatoes","1 large onion, finely chopped","3 stalks celery, chopped","Fresh cilantro and parsley","2 tbsp tomato paste","1 tsp each: turmeric, cinnamon, ginger, cumin","100g vermicelli noodles","Juice of 1 lemon","Salt and pepper","Lemon wedges to serve"],
    steps:["Heat olive oil in a large pot. Brown meat if using, set aside.","Fry onion and celery until soft, 5 minutes. Add all spices and cook 1 minute.","Add tomato paste, canned tomatoes, and 1.5 litres water. Add lentils and meat. Boil then simmer 20 minutes.","Add chickpeas, simmer 10 more minutes until lentils are soft.","Add vermicelli and cook 5 minutes.","Stir in fresh herbs and lemon juice. Season well.","Serve hot with fresh herbs and lemon wedges."]

    description:"A beloved Hu\u1ebf dish of tiny baby clams tossed with rice, fresh herbs, peanuts, fried pork skin and fermented shrimp paste. Created by the poor, offered to the king \u2014 sold at \u0110\u00f4ng Ba market every morning for just $0.50.",
    cookTime:30,servings:2,difficulty:"Easy",
    youtubeUrl:"https://www.youtube.com/@BestEverFoodReviewShow",
    ingredients:["300g baby river clams, cleaned and cooked","1 cup cooked white rice","1 tbsp fermented shrimp paste (mắm ruốc)","1 tbsp cashew oil or chilli oil","1 tsp MSG (optional, traditional)","Fresh herbs: mint, perilla, rau muống","¼ young banana blossom, thinly sliced","2 tbsp roasted peanuts, crushed","Handful fried pork skin, broken into pieces","Fresh chilli to serve","Lime wedges to serve"],
    steps:["Steam live clams open over high heat, pick out the meat. Reserve a little clam broth.","In a large bowl, lay cooked rice as the base.","Top with clam meat, fresh herbs, banana blossom, peanuts, and fried pork skin. Arrange beautifully — presentation matters.","Mix fermented shrimp paste, cashew oil, chilli oil, and a splash of clam broth to make the dressing.","Drizzle dressing over everything. Add a squeeze of lime and fresh chilli.","Mix it all together thoroughly until every ingredient is evenly coated.","Serve immediately while the pork skin is still crunchy."]

    steps:["Make the filling: sauté shallots in oil until fragrant. Add pork and shrimp, season with fish sauce, sugar, salt and pepper. Cook until just done. Set aside.","Bánh Nậm batter: mix rice flour and tapioca starch with water. Cook in a pot over medium heat, stirring constantly until it thickens into a translucent paste.","Bánh Lọc dough: pour boiling water over tapioca starch and mix immediately until a clear stretchy dough forms. Knead briefly until smooth.","Assemble Bánh Nậm: spread thin layer of rice batter on a banana leaf, place filling in centre, fold leaf over and press flat.","Assemble Bánh Lọc: flatten tapioca dough into a circle, place 1 shrimp and pork in centre, fold into a half-moon. Wrap in banana leaf.","Steam all parcels over high heat for 15–20 minutes.","Serve hot still in the banana leaves. Unwrap at the table and dip in sweet chilli fish sauce."]

    description:"Ethiopia's spectacular vegan platter \u2014 a vibrant rainbow of spiced stews and vegetables served on injera. At least 6 dishes, sometimes up to 23. Sonny had this at Habesha Restaurant and called it vegan heaven.",
    cookTime:60,servings:4,difficulty:"Medium",
    youtubeUrl:"https://www.youtube.com/@BestEverFoodReviewShow",
    ingredients:["Large injera as the base","Misir (red lentils): 200g red lentils, 1 onion, 2 tbsp berbere, 2 cloves garlic, 1 tbsp vegan niter kibbeh","Gomen (collard greens): 1 bunch collard greens, 1 onion, 3 cloves garlic, 1 tsp turmeric, 1 tsp ginger","Shiro: 4 tbsp chickpea powder, 1 onion, 2 cloves garlic, 1 cup water, 1 tbsp niter kibbeh, 1 tsp berbere","Tikil Gomen: ½ cabbage, 2 carrots, 1 onion, turmeric, cumin"],
    steps:["Lay injera flat on a large round tray as your edible plate.","Misir: sauté onion until soft. Add garlic and berbere. Add rinsed lentils and water to cover. Simmer 20 minutes until thick. Finish with vegan niter kibbeh.","Gomen: blanch collard greens 2 minutes. Sauté onion and garlic with turmeric and ginger. Add greens and cook 5 more minutes. Season with salt.","Shiro: fry onion and garlic in oil. Add water and chickpea powder, whisk constantly to prevent lumps. Cook until thick and smooth, about 10 minutes. Add niter kibbeh and berbere.","Tikil Gomen: sauté onion, add cabbage and carrots with turmeric and cumin. Cook until tender but still with some texture.","Arrange all stews side by side on top of the injera — make it colourful and generous.","Serve with extra injera rolls on the side for scooping. Eat with your hands."]

    description:"Ethiopian beef tartare \u2014 freshly minced raw beef mixed with jalape\u00f1o, onion, mitmita spice blend, and olive oil. A delicacy at Yilma Butcher, a 40-year-old institution in Addis Ababa. Traditionally followed by a shot of areki.",
    cookTime:15,servings:2,difficulty:"Easy",
    youtubeUrl:"https://www.youtube.com/@BestEverFoodReviewShow",
    ingredients:["300g very fresh beef (prime cut — must be extremely fresh, same day from butcher)","1 jalapeño, very finely minced","½ small white onion, very finely minced","1 tsp mitmita spice blend (chilli, cardamom, cloves, salt)","1 tbsp olive oil","Salt to taste","Injera or torn bread to serve","Mustard or awaze sauce on the side"],
    steps:["Source the freshest beef possible — ideally from a butcher on the same day. The cut below the hump is preferred.","Using a very sharp knife, mince the beef finely by hand. Do not use a food processor — texture should be slightly coarse, not a paste.","Add finely minced jalapeño and onion to the beef.","Sprinkle in mitmita spice blend and drizzle with olive oil. Mix gently until just combined.","Taste and adjust salt. The texture should be smooth, moist, and slightly loose.","Serve immediately on injera or with torn bread. Add mustard or awaze sauce on the side.","Traditionally followed by a shot of areki (Ethiopian grain spirit) to kill any worms — optional but authentic."]
