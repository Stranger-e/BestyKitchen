<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recipe — BestyKitchen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Lora:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #E8272A;
    --dark: #1A1A1A;
    --cream: #F5F0E8;
    --warm-white: #FEFCF8;
    --gold: #C9952A;
    --mid: #6B6560;
    --border: rgba(26,26,26,0.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--warm-white); color: var(--dark); }

  nav {
    background: var(--dark); padding: 0 40px;
    display: flex; align-items: center; justify-content: space-between;
    height: 60px; position: sticky; top: 0; z-index: 100;
  }
  .logo { font-family: 'Bebas Neue', sans-serif; font-size: 26px; letter-spacing: 2px; color: var(--cream); text-decoration: none; }
  .logo span { color: var(--red); }
  nav ul { list-style: none; display: flex; gap: 32px; }
  nav ul a { color: rgba(245,240,232,0.65); text-decoration: none; font-size: 13px; font-weight: 500; letter-spacing: 0.5px; text-transform: uppercase; }
  nav ul a:hover { color: var(--cream); }
  .nav-add { background: var(--red); color: #fff !important; padding: 7px 16px; border-radius: 4px; font-size: 12px !important; }

  /* HERO IMAGE */
  .recipe-hero {
    width: 100%; height: 420px; position: relative; overflow: hidden;
    background: linear-gradient(135deg, #2a2520, #1a1510);
    display: flex; align-items: center; justify-content: center;
  }
  .recipe-hero img { width: 100%; height: 100%; object-fit: cover; }
  .recipe-hero-placeholder { font-size: 80px; }
  .recipe-hero-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.2) 60%, transparent 100%);
  }
  .recipe-hero-info {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 32px 40px;
  }
  .recipe-episode { font-size: 11px; color: var(--red); font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 10px; }
  .recipe-title { font-family: 'Bebas Neue', sans-serif; font-size: 56px; color: #fff; letter-spacing: 2px; line-height: 1; }
  .recipe-country-badge {
    display: inline-block; background: var(--red); color: #fff;
    font-size: 11px; font-weight: 500; letter-spacing: 1px; text-transform: uppercase;
    padding: 4px 12px; border-radius: 2px; margin-top: 12px;
  }

  /* LAYOUT */
  .recipe-layout {
    display: grid;
    grid-template-columns: 1fr 340px;
    gap: 48px;
    max-width: 1100px;
    margin: 0 auto;
    padding: 48px 40px;
  }

  /* MAIN CONTENT */
  .recipe-description {
    font-family: 'Lora', serif;
    font-size: 17px;
    line-height: 1.8;
    color: var(--mid);
    font-style: italic;
    margin-bottom: 36px;
    padding-bottom: 36px;
    border-bottom: 1px solid var(--border);
  }

  .section-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 2px;
    color: var(--dark);
    margin-bottom: 20px;
  }

  .steps-list { list-style: none; }
  .step-item {
    display: flex;
    gap: 20px;
    margin-bottom: 28px;
    padding-bottom: 28px;
    border-bottom: 1px solid var(--border);
  }
  .step-item:last-child { border-bottom: none; }
  .step-num {
    flex-shrink: 0;
    width: 36px; height: 36px;
    background: var(--dark); color: var(--cream);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px; letter-spacing: 1px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 2px; margin-top: 2px;
  }
  .step-text { font-size: 15px; line-height: 1.75; color: var(--dark); padding-top: 6px; }

  /* SIDEBAR */
  .sidebar { position: sticky; top: 80px; align-self: start; }

  .meta-card {
    background: var(--cream);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 24px;
    margin-bottom: 20px;
  }

  .meta-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 0; border-bottom: 1px solid var(--border);
    font-size: 14px;
  }
  .meta-row:last-child { border-bottom: none; }
  .meta-label { color: var(--mid); font-size: 12px; text-transform: uppercase; letter-spacing: 0.8px; }
  .meta-val { font-weight: 500; }

  .ingredients-card {
    background: var(--dark);
    border-radius: 6px;
    padding: 24px;
  }

  .ingredients-card .section-title { color: var(--cream); margin-bottom: 16px; }

  .ingredient-item {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.07);
    font-size: 14px; color: rgba(245,240,232,0.8);
  }
  .ingredient-item:last-child { border-bottom: none; }
  .ingredient-bullet { color: var(--red); margin-top: 2px; font-size: 16px; line-height: 1; }

  .yt-link {
    display: flex; align-items: center; gap: 10px;
    background: #E8272A; color: #fff;
    padding: 12px 20px; border-radius: 4px;
    text-decoration: none; font-size: 13px; font-weight: 500;
    margin-top: 16px; text-transform: uppercase; letter-spacing: 0.5px;
    transition: background 0.2s;
  }
  .yt-link:hover { background: #c41f22; }

  .back-link {
    display: inline-flex; align-items: center; gap: 8px;
    color: var(--mid); font-size: 13px; text-decoration: none;
    margin-bottom: 8px;
  }
  .back-link:hover { color: var(--dark); }

  @media (max-width: 768px) {
    .recipe-layout { grid-template-columns: 1fr; padding: 24px 16px; gap: 24px; }
    .recipe-title { font-size: 38px; }
    .recipe-hero { height: 280px; }
    nav { padding: 0 16px; }
    .recipe-hero-info { padding: 20px 16px; }
    .sidebar { position: static; }
  }
</style>
</head>
<body>

<nav>
  <a href="index.html" class="logo">Besty<span>Kitchen</span></a>
  <ul>
    <li><a href="index.html">Recipes</a></li>
  </ul>
</nav>

<div id="recipe-content">
  <div style="padding:80px 40px;text-align:center;color:var(--mid)">Loading recipe...</div>
</div>

<script>
  function getRecipes() {
    try { return JSON.parse(localStorage.getItem('bk_recipes') || '[]'); } catch { return []; }
  }

  function getParam(name) {
    return new URLSearchParams(window.location.search).get(name);
  }

  function parseIngredients(text) {
    if (!text) return [];
    return text.split('\n').map(l => l.trim()).filter(Boolean);
  }

  function parseSteps(text) {
    if (!text) return [];
    return text.split('\n').map(l => l.trim()).filter(Boolean);
  }

  function render(recipe) {
    const steps = parseSteps(recipe.steps);
    const ingredients = parseIngredients(recipe.ingredients);

    const heroImg = recipe.image
      ? `<img src="${recipe.image}" alt="${recipe.title}">`
      : `<div class="recipe-hero-placeholder">🍽️</div>`;

    document.title = `${recipe.title} — BestyKitchen`;

    document.getElementById('recipe-content').innerHTML = `
      <div class="recipe-hero">
        ${heroImg}
        <div class="recipe-hero-overlay"></div>
        <div class="recipe-hero-info">
          <div class="recipe-episode">${recipe.episode || 'BEFRS Episode'}</div>
          <div class="recipe-title">${recipe.title}</div>
          <div class="recipe-country-badge">📍 ${recipe.country || 'World'}</div>
        </div>
      </div>

      <div class="recipe-layout">
        <div class="recipe-main">
          <div style="margin-bottom:28px">
            <a href="index.html" class="back-link">← All Recipes</a>
          </div>

          ${recipe.description ? `<div class="recipe-description">${recipe.description}</div>` : ''}

          ${steps.length ? `
            <div class="section-title">How to Cook</div>
            <ol class="steps-list">
              ${steps.map((s, i) => `
                <li class="step-item">
                  <div class="step-num">${i + 1}</div>
                  <div class="step-text">${s}</div>
                </li>`).join('')}
            </ol>` : '<p style="color:var(--mid)">No steps added yet.</p>'}
        </div>

        <div class="sidebar">
          <div class="meta-card">
            <div class="meta-row">
              <span class="meta-label">Country</span>
              <span class="meta-val">${recipe.country || '—'}</span>
            </div>
            <div class="meta-row">
              <span class="meta-label">Cook Time</span>
              <span class="meta-val">${recipe.cookTime ? recipe.cookTime + ' mins' : '—'}</span>
            </div>
            <div class="meta-row">
              <span class="meta-label">Servings</span>
              <span class="meta-val">${recipe.servings || '—'}</span>
            </div>
            <div class="meta-row">
              <span class="meta-label">Difficulty</span>
              <span class="meta-val">${recipe.difficulty || '—'}</span>
            </div>
          </div>

          <div class="ingredients-card">
            <div class="section-title">Ingredients</div>
            ${ingredients.length
              ? ingredients.map(i => `<div class="ingredient-item"><span class="ingredient-bullet">●</span>${i}</div>`).join('')
              : '<div style="color:rgba(245,240,232,0.4);font-size:14px">No ingredients listed.</div>'}
          </div>

          ${recipe.youtubeUrl ? `<a href="${recipe.youtubeUrl}" target="_blank" class="yt-link">▶ Watch on YouTube</a>` : ''}
        </div>
      </div>`;
  }

  const id = getParam('id');
  const recipes = getRecipes();
  const recipe = recipes.find(r => r.id === id);

  if (recipe) {
    render(recipe);
  } else {
    document.getElementById('recipe-content').innerHTML = `
      <div style="padding:80px 40px;text-align:center">
        <div style="font-size:48px">😕</div>
        <h2 style="font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:2px;margin-top:16px">Recipe Not Found</h2>
        <a href="index.html" style="display:inline-block;margin-top:20px;color:var(--red);text-decoration:none;font-size:14px">← Back to all recipes</a>
      </div>`;
  }
</script>

</body>
</html>
